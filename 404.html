<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Yash Sharma Portfolio</title>
  <meta name="description"
    content="The page you're looking for doesn't exist. Return to Yash Sharma's portfolio homepage.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://about.yashrma.xyz/">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .error-container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      margin: 2rem auto;
    }

    .error-code {
      font-size: 4rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #666;
    }

    .home-link {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .home-link:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="error-container">
      <div class="error-code">404</div>
      <div class="error-message">
        <h2>Oops! Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
      </div>
      <a href="/" class="home-link">Return to Homepage</a>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/templates.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      loadHeader();
      loadFooter();
    });
  </script>
</body>

</html>
